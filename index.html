    <style>
      /* Instant app-shell — renders before the JS bundle executes so users see
         real chrome (<100ms) instead of a blank page or full-screen spinner.
         React replaces #root children on mount. */
      html, body { margin: 0; background: #000; }
      #app-shell, #app-shell * { box-sizing: border-box; }
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #000;
        color: #fff;
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        z-index: 0;
      }
      #app-shell .sk-header {
        height: 69px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 12px;
      }
      #app-shell .sk-logo { width: 36px; height: 36px; display: block; }
      #app-shell .sk-title { display: block; font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
      #app-shell .sk-sub { display: block; font-size: 12px; line-height: 16px; letter-spacing: 0.025em; color: rgba(255,255,255,0.6); }
      #app-shell .sk-toolbar {
        height: 57px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 24px;
      }
      #app-shell .sk-strip {
        height: 212px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 12px 24px 0;
        overflow: hidden;
      }
      #app-shell .sk-strip-head { height: 32px; display: flex; align-items: center; justify-content: space-between; }
      #app-shell .sk-cards { display: flex; gap: 10px; margin-top: 9px; }
      #app-shell .sk-card { width: 112px; height: 143px; flex-shrink: 0; border-radius: 16px; }
      #app-shell .sk-body { flex: 1; display: flex; min-height: 0; }
      #app-shell .sk-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #app-shell .sk-canvas {
        flex: 1;
        min-height: 0;
        background: linear-gradient(to bottom, #171717 0%, #1a1a1a 30%, #1a1a1a 70%, #1e1e1e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-shell .sk-panel {
        width: 340px;
        flex-shrink: 0;
        border-left: 1px solid rgba(255,255,255,0.08);
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      @media (min-width: 1280px) { #app-shell .sk-panel { width: 400px; } }
      #app-shell .sk-movie { aspect-ratio: 1; border-radius: 16px; }
      #app-shell .sk-footer { height: 45px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.08); }
      #app-shell .sk-narrow { display: none; }
      @media (max-width: 1023px) {
        #app-shell .sk-body, #app-shell .sk-footer { display: none; }
        #app-shell .sk-narrow { flex: 1; display: flex; align-items: center; justify-content: center; }
      }
      #app-shell .sk-box {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
      }
      #app-shell .sk-pill { height: 36px; width: 96px; border-radius: 8px; }
      #app-shell .sk-line { height: 12px; border-radius: 6px; }
      #app-shell .sk-spinner {
        width: 34px; height: 34px; border-radius: 9999px;
        border: 2px solid rgba(255,255,255,0.18);
        border-top-color: rgba(255,255,255,0.8);
        animation: sk-spin 0.8s linear infinite;
      }
      @keyframes sk-spin { to { transform: rotate(360deg); } }
      @keyframes sk-shimmer { 0% { opacity: 0.45; } 50% { opacity: 0.8; } 100% { opacity: 0.45; } }
      #app-shell .sk-shimmer { animation: sk-shimmer 1.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        #app-shell .sk-spinner { animation: none; }
        #app-shell .sk-shimmer { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-shell" aria-hidden="true">
        <div class="sk-header">
          <img class="sk-logo" src="/favicon.svg" width="36" height="36" alt="" />
          <div>
            <span class="sk-title">MitoSpace Explorer</span>
            <span class="sk-sub">Mitochondrial phenotype atlas</span>
          </div>
        </div>
        <div class="sk-body">
          <div class="sk-left">
            <div class="sk-toolbar">
              <div class="sk-pill sk-box sk-shimmer" style="width:180px;"></div>
              <div class="sk-pill sk-box sk-shimmer" style="width:138px;"></div>
              <div style="flex:1;"></div>
              <div class="sk-pill sk-box sk-shimmer" style="width:180px;"></div>
            </div>
            <div class="sk-strip">
              <div class="sk-strip-head">
                <div class="sk-line sk-box sk-shimmer" style="width:220px;"></div>
                <div class="sk-line sk-box sk-shimmer" style="width:180px; height:32px; border-radius:8px;"></div>
              </div>
              <div class="sk-cards">
                <div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div>
                <div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div>
                <div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div>
                <div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div><div class="sk-card sk-box sk-shimmer"></div>
              </div>
            </div>
            <div class="sk-canvas">
              <div class="sk-spinner"></div>
            </div>
          </div>
          <div class="sk-panel">
            <div class="sk-box sk-shimmer" style="height:158px; border-radius:16px;"></div>
            <div class="sk-line sk-box sk-shimmer" style="width:110px; margin-top:12px;"></div>
            <div class="sk-movie sk-box sk-shimmer"></div>
          </div>
        </div>
        <div class="sk-footer"></div>
        <div class="sk-narrow"><div class="sk-spinner"></div></div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#000;color:#fff;font-family:'DM Sans',system-ui,sans-serif;text-align:center;">
        MitoSpace Explorer needs JavaScript. Please enable it and reload the page.

    <script type="module" src="/src/main.tsx"></script>
