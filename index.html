<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MitoSpace Explorer — Interactive visualization of mitochondrial phenotypes from LLSM time-lapse microscopy" />
    <title>MitoSpace Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="beba6a19-eda0-4df5-8c27-a825838e5001"></script>
    <style>
      /* Instant app-shell — renders before the JS bundle executes so users see
         real chrome (<100ms) instead of a blank page or full-screen spinner.
         React replaces #root children on mount. */
      html, body { margin: 0; background: #000; }
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #000;
        color: #fff;
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        z-index: 0;
      }
      #app-shell .sk-header {
        height: 56px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 12px;
      }
      #app-shell .sk-brand {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
      }
      #app-shell .sk-toolbar {
        height: 49px;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 24px;
      }
      #app-shell .sk-body { flex: 1; display: flex; min-height: 0; }
      #app-shell .sk-canvas {
        flex: 1;
        min-width: 0;
        background: linear-gradient(to bottom, #171717 0%, #1a1a1a 30%, #1a1a1a 70%, #1e1e1e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-shell .sk-panel {
        width: 400px;
        flex-shrink: 0;
        border-left: 1px solid rgba(255,255,255,0.08);
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #app-shell .sk-box {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
      }
      #app-shell .sk-pill { height: 32px; width: 96px; border-radius: 8px; }
      #app-shell .sk-line { height: 12px; border-radius: 6px; }
      #app-shell .sk-spinner {
        width: 34px; height: 34px; border-radius: 9999px;
        border: 2px solid rgba(255,255,255,0.18);
        border-top-color: rgba(255,255,255,0.8);
        animation: sk-spin 0.8s linear infinite;
      }
      @keyframes sk-spin { to { transform: rotate(360deg); } }
      @keyframes sk-shimmer { 0% { opacity: 0.45; } 50% { opacity: 0.8; } 100% { opacity: 0.45; } }
      #app-shell .sk-shimmer { animation: sk-shimmer 1.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        #app-shell .sk-spinner { animation: none; }
        #app-shell .sk-shimmer { animation: none; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-shell" aria-hidden="true">
        <div class="sk-header">
          <span class="sk-brand">MitoSpace</span>
          <div class="sk-line sk-box sk-shimmer" style="width:120px;"></div>
        </div>
        <div class="sk-toolbar">
          <div class="sk-pill sk-box sk-shimmer"></div>
          <div class="sk-pill sk-box sk-shimmer" style="width:120px;"></div>
          <div class="sk-pill sk-box sk-shimmer" style="width:80px;"></div>
        </div>
        <div class="sk-body">
          <div class="sk-canvas">
            <div class="sk-spinner"></div>
          </div>
          <div class="sk-panel">
            <div class="sk-box sk-shimmer" style="height:200px;"></div>
            <div class="sk-line sk-box sk-shimmer" style="width:70%;"></div>
            <div class="sk-line sk-box sk-shimmer" style="width:90%;"></div>
            <div class="sk-line sk-box sk-shimmer" style="width:55%;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
