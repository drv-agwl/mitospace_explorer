# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# Before syncing: match `name` and `branch` to the existing service and add `plan:` with its
# current instance type, otherwise Render may create a new service or change the plan.
services:
  - type: web
    name: mitospace-api
    runtime: python
    branch: v3_prod
    buildCommand: pip install -r server/requirements.lock
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    # 200 only once the v3 data is loaded; a deploy whose data fails to load never goes live.
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Extra allowed browser origins, comma-separated (mitospace.ai is always allowed).
      - key: CORS_ORIGINS
        sync: false
      # Netlify site name, to allow its branch and deploy-preview URLs.
      - key: NETLIFY_SITE_NAME
        sync: false
      - key: ENABLE_CHAT
        value: "0"
      - key: OPENROUTER_API_KEY
        sync: false
      # Visit log (docs/DEPLOY_NETLIFY.md, "Visitor analytics"); all optional.
      - key: IPAPI_KEY
        sync: false
      - key: VISIT_LOG_WEBHOOK_URL
        sync: false
      - key: VISIT_ALERT_WEBHOOK_URL
        sync: false
